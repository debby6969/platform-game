
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Game</title>

    <style>
        body {
            margin: 0;
            background: #151F4D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        canvas {
            width: min(100vw, 1000px);
            height: auto;
            aspect-ratio: 5 / 3;
            display: block;
            outline: none;
        }
    </style>
</head>

<body>

<canvas id="game" width="1000" height="600" tabindex="0"></canvas>

<script>
    // Canvas setup
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Window dimensions
    const WIDTH = 1000;
    const HEIGHT = 600;

    // Platforms
    const platforms = [
        {
            x: 250,
            y: 300,
            width: 500,
            height: 10
        },
        {
            x: 400,
            y: 190,
            width: 200,
            height: 10
        }
    ];

    // Player
    const PLAYER_W = 20;
    const PLAYER_H = 40;
    const SPEED = 250;

    let playerX = WIDTH / 2 - PLAYER_W / 2;
    let playerY = platforms[0].y - PLAYER_H;

    // Physics
    const GRAVITY = 1200;
    const JUMP_FORCE = -550;

    let velocityY = 0;
    let onGround = true;

    // Keyboard input
    const keys = new Set();

    window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();

        if (["a", "d", "arrowleft", "arrowright", " "].includes(key)) {
            e.preventDefault();
        }

        keys.add(key);
    });

    window.addEventListener("keyup", (e) => {
        keys.delete(e.key.toLowerCase());
    });

    window.addEventListener("blur", () => {
        keys.clear();
    });

    // Jump function
    function jump() {
        if (onGround) {
            velocityY = JUMP_FORCE;
            onGround = false;
        }
    }

    // Update game logic
    function update(dt) {

        // Horizontal movement
        let dx = 0;

        if (keys.has("a") || keys.has("arrowleft")) {
            dx -= SPEED * dt;
        }

        if (keys.has("d") || keys.has("arrowright")) {
            dx += SPEED * dt;
        }

        playerX += dx;

        // Reset player if completely off screen
        if (playerX + PLAYER_W < 0 || playerX > WIDTH) {
            playerX = WIDTH / 2 - PLAYER_W / 2;
            playerY = platforms[0].y - PLAYER_H;
            velocityY = 0;
            onGround = true;
        }

        // Jump
        if (keys.has(" ")) {
            jump();
        }

        // Store previous vertical position
        const previousY = playerY;

        // Apply gravity
        velocityY += GRAVITY * dt;
        playerY += velocityY * dt;

        // Platform collision detection
        onGround = false;

        if (velocityY >= 0) {
            for (const platform of platforms) {

                const previousBottom = previousY + PLAYER_H;
                const currentBottom = playerY + PLAYER_H;

                const overlapsPlatform =
                    playerX + PLAYER_W > platform.x &&
                    playerX < platform.x + platform.width;

                const crossedPlatform =
                    previousBottom <= platform.y &&
                    currentBottom >= platform.y;

                if (overlapsPlatform && crossedPlatform) {
                    playerY = platform.y - PLAYER_H;
                    velocityY = 0;
                    onGround = true;
                    break;
                }
            }
        }

        // Fall below screen: reset player
        if (playerY > HEIGHT) {
            playerX = WIDTH / 2 - PLAYER_W / 2;
            playerY = platforms[0].y - PLAYER_H;
            velocityY = 0;
            onGround = true;
        }
    }

    // Draw everything
    function draw() {

        // Background
        ctx.fillStyle = "#151F4D";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Draw platforms
        ctx.fillStyle = "#a6adc8";

        for (const platform of platforms) {
            ctx.fillRect(
                platform.x,
                platform.y,
                platform.width,
                platform.height
            );
        }

        // Draw player
        ctx.fillStyle = "#f38ba8";
        ctx.fillRect(playerX, playerY, PLAYER_W, PLAYER_H);
    }

    // Game loop
    let lastTime = 0;

    function gameLoop(timestamp) {

        if (lastTime === 0) {
            lastTime = timestamp;
        }

        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // Start game
    requestAnimationFrame(gameLoop);

    canvas.focus();

</script>

</body>
</html>
