
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Climber</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #151F4D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            background: #151F4D;
            border: 2px solid #a6adc8;
            max-width: 95vw;
            max-height: 90vh;
        }
    </style>
</head>

<body>

<canvas id="game" width="1000" height="600" tabindex="0"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// Player
const PLAYER_W = 20;
const PLAYER_H = 40;
const SPEED = 250;

const GRAVITY = 1300;
const JUMP_FORCE = -560;

let playerX;
let playerY;
let velocityY = 0;
let onGround = false;

const keys = new Set();

// Platforms
const platforms = [];

// Generate floors
function createPlatforms() {
    platforms.length = 0;

    const floorCount = 12;
    const baseY = 540;

    const positions = [
        250, 550, 350, 120,
        470, 700, 300, 80,
        580, 350, 130, 650
    ];

    for (let i = 0; i < floorCount; i++) {
        const width = Math.max(170, 320 - i * 12);
        const height = 10;
        const y = baseY - i * 100 - Math.floor(i / 4) * 10;

        platforms.push({
            x: positions[i],
            y: y,
            width: width,
            height: height,
            level: i
        });
    }
}

createPlatforms();

// Player starting position
function resetPlayer() {
    const start = platforms[0];

    playerX = start.x + (start.width - PLAYER_W) / 2;
    playerY = start.y - PLAYER_H;

    velocityY = 0;
    onGround = true;
}

resetPlayer();

// Camera
let cameraY = 0;

// Keyboard input
window.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();

    if ([" ", "arrowleft", "arrowright", "arrowup"].includes(key)) {
        e.preventDefault();
    }

    keys.add(key);
});

window.addEventListener("keyup", (e) => {
    keys.delete(e.key.toLowerCase());
});

// Colour interpolation
function getFloorColour(level) {
    const start = [166, 173, 200];
    const end = [240, 245, 255];

    const t = Math.min(level / 11, 1);

    const r = Math.round(start[0] + (end[0] - start[0]) * t);
    const g = Math.round(start[1] + (end[1] - start[1]) * t);
    const b = Math.round(start[2] + (end[2] - start[2]) * t);

    return `rgb(${r}, ${g}, ${b})`;
}

// Update game
function update(dt) {
    // Horizontal movement
    let dx = 0;

    if (keys.has("a") || keys.has("arrowleft")) {
        dx -= SPEED * dt;
    }

    if (keys.has("d") || keys.has("arrowright")) {
        dx += SPEED * dt;
    }

    playerX += dx;

    // Jump
    if ((keys.has(" ") || keys.has("w") || keys.has("arrowup")) && onGround) {
        velocityY = JUMP_FORCE;
        onGround = false;
    }

    // Gravity
    const previousBottom = playerY + PLAYER_H;

    velocityY += GRAVITY * dt;
    playerY += velocityY * dt;

    onGround = false;

    // Platform collision
    if (velocityY >= 0) {
        for (const platform of platforms) {
            const currentBottom = playerY + PLAYER_H;

            const crossedPlatform =
                previousBottom <= platform.y &&
                currentBottom >= platform.y;

            const horizontalOverlap =
                playerX + PLAYER_W > platform.x &&
                playerX < platform.x + platform.width;

            if (crossedPlatform && horizontalOverlap) {
                playerY = platform.y - PLAYER_H;
                velocityY = 0;
                onGround = true;
                break;
            }
        }
    }

    // Camera follows player upwards
    const targetCamera = playerY - 300;

    if (targetCamera < cameraY) {
        cameraY = targetCamera;
    }

    // Reset if player falls off
    if (playerY > cameraY + HEIGHT + 100) {
        resetPlayer();
        cameraY = 0;
    }
}

// Draw game
function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Background
    ctx.fillStyle = "#151F4D";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Platforms
    for (const platform of platforms) {
        const screenY = platform.y - cameraY;

        if (screenY < -20 || screenY > HEIGHT + 20) {
            continue;
        }

        ctx.fillStyle = getFloorColour(platform.level);

        ctx.fillRect(
            platform.x,
            screenY,
            platform.width,
            platform.height
        );
    }

    // Player
    ctx.fillStyle = "#f38ba8";

    ctx.fillRect(
        playerX,
        playerY - cameraY,
        PLAYER_W,
        PLAYER_H
    );

    // Level indicator
    const level = Math.max(
        0,
        platforms.filter(p => playerY + PLAYER_H <= p.y).length
    );

    ctx.fillStyle = "#ffffff";
    ctx.font = "18px Arial";
    ctx.fillText("Climb higher!", 20, 35);
}

// Main game loop
let lastTime = 0;

function gameLoop(timestamp) {
    if (lastTime === 0) {
        lastTime = timestamp;
    }

    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    // Prevent large jumps if the tab freezes
    dt = Math.min(dt, 0.033);

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
