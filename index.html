
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Climber</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #151F4D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid #a6adc8;
            max-width: 95vw;
            max-height: 90vh;
        }
    </style>
</head>

<body>

<canvas id="game" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const PLAYER_W = 20;
const PLAYER_H = 40;
const SPEED = 250;

const GRAVITY = 1300;
const JUMP_FORCE = -560;

const FLOOR_COUNT = 30;
const FLOOR_GAP = 85;

let playerX;
let playerY;
let velocityY = 0;
let onGround = false;
let cameraY = 0;

const keys = new Set();
const platforms = [];
const hazards = [];

// Platform layout
function createPlatforms() {
    platforms.length = 0;
    hazards.length = 0;

    const baseY = 540;

    const centres = [
        500, 590, 490, 400,
        510, 600, 500, 400
    ];

    for (let i = 0; i < FLOOR_COUNT; i++) {
        const width = Math.max(130, 260 - i * 4.5);
        const centre = centres[i % centres.length];

        const platform = {
            x: centre - width / 2,
            y: baseY - i * FLOOR_GAP,
            width: width,
            height: 10,
            level: i
        };

        platforms.push(platform);

        // Add hazards from floor 11 onwards
        if (i >= 10) {
            const hazardWidth = 35;
            const hazardHeight = 22;

            hazards.push({
                x: centre - hazardWidth / 2,
                y: platform.y - hazardHeight,
                width: hazardWidth,
                height: hazardHeight
            });
        }
    }
}

createPlatforms();

// Reset player
function resetPlayer() {
    const start = platforms[0];

    playerX = start.x + (start.width - PLAYER_W) / 2;
    playerY = start.y - PLAYER_H;

    velocityY = 0;
    onGround = true;
    cameraY = 0;
}

// Keyboard controls
window.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();

    if ([" ", "arrowleft", "arrowright", "arrowup"].includes(key)) {
        e.preventDefault();
    }

    keys.add(key);
});

window.addEventListener("keyup", (e) => {
    keys.delete(e.key.toLowerCase());
});

resetPlayer();

// Colour interpolation
function interpolateColour(start, end, amount) {
    const r = Math.round(start[0] + (end[0] - start[0]) * amount);
    const g = Math.round(start[1] + (end[1] - start[1]) * amount);
    const b = Math.round(start[2] + (end[2] - start[2]) * amount);

    return `rgb(${r}, ${g}, ${b})`;
}

function getBackgroundColour(progress) {
    return interpolateColour(
        [21, 31, 77],
        [175, 205, 235],
        progress
    );
}

function getFloorColour(level) {
    return interpolateColour(
        [166, 173, 200],
        [245, 248, 255],
        level / (FLOOR_COUNT - 1)
    );
}

// Collision detection between rectangles
function rectanglesOverlap(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

// Update game
function update(dt) {
    // Horizontal movement
    let dx = 0;

    if (keys.has("a") || keys.has("arrowleft")) {
        dx -= SPEED * dt;
    }

    if (keys.has("d") || keys.has("arrowright")) {
        dx += SPEED * dt;
    }

    playerX += dx;

    // Jump
    if (
        (keys.has(" ") || keys.has("w") || keys.has("arrowup")) &&
        onGround
    ) {
        velocityY = JUMP_FORCE;
        onGround = false;
    }

    // Gravity
    const previousBottom = playerY + PLAYER_H;

    velocityY += GRAVITY * dt;
    playerY += velocityY * dt;

    onGround = false;

    // Platform collision
    if (velocityY >= 0) {
        for (const platform of platforms) {
            const currentBottom = playerY + PLAYER_H;

            const crossedPlatform =
                previousBottom <= platform.y &&
                currentBottom >= platform.y;

            const horizontalOverlap =
                playerX + PLAYER_W > platform.x &&
                playerX < platform.x + platform.width;

            if (crossedPlatform && horizontalOverlap) {
                playerY = platform.y - PLAYER_H;
                velocityY = 0;
                onGround = true;
                break;
            }
        }
    }

    // Hazard collision
    const player = {
        x: playerX,
        y: playerY,
        width: PLAYER_W,
        height: PLAYER_H
    };

    for (const hazard of hazards) {
        if (rectanglesOverlap(player, hazard)) {
            resetPlayer();
            return;
        }
    }

    // Camera follows player upwards
    const targetCamera = playerY - 300;

    if (targetCamera < cameraY) {
        cameraY = targetCamera;
    }

    // Reset if player falls below the screen
    if (playerY > cameraY + HEIGHT + 100) {
        resetPlayer();
    }
}

// Draw game
function draw() {
    const climbedFloors = Math.max(
        0,
        (540 - (playerY + PLAYER_H)) / FLOOR_GAP
    );

    const progress = Math.min(
        climbedFloors / (FLOOR_COUNT - 1),
        1
    );

    // Background
    ctx.fillStyle = getBackgroundColour(progress);
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Platforms
    for (const platform of platforms) {
        const screenY = platform.y - cameraY;

        if (screenY < -20 || screenY > HEIGHT + 20) {
            continue;
        }

        ctx.fillStyle = getFloorColour(platform.level);

        ctx.fillRect(
            platform.x,
            screenY,
            platform.width,
            platform.height
        );
    }

    // Red hazards
    for (const hazard of hazards) {
        const screenY = hazard.y - cameraY;

        if (screenY < -30 || screenY > HEIGHT + 30) {
            continue;
        }

        ctx.fillStyle = "#ff3030";

        ctx.fillRect(
            hazard.x,
            screenY,
            hazard.width,
            hazard.height
        );
    }

    // Player
    ctx.fillStyle = "#f38ba8";

    ctx.fillRect(
        playerX,
        playerY - cameraY,
        PLAYER_W,
        PLAYER_H
    );

    // Floor counter
    const currentFloor = Math.min(
        FLOOR_COUNT,
        Math.max(1, Math.floor(climbedFloors) + 1)
    );

    ctx.fillStyle = progress > 0.55 ? "#26345c" : "#ffffff";
    ctx.font = "20px Arial";

    ctx.fillText(
        `Floor ${currentFloor} / ${FLOOR_COUNT}`,
        20,
        35
    );
}

// Main game loop
let lastTime = 0;

function gameLoop(timestamp) {
    if (lastTime === 0) {
        lastTime = timestamp;
    }

    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    dt = Math.min(dt, 0.033);

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
